# Small configuration that runs the whole pipeline in minutes.
benchmark:
  m: [5]
  nk: [30]
  lambdas: [0.0, 0.25, 0.5, 0.75, 1.0]
  f6_q: [0, 1, 5]
  instances: 3
noise:
  realizations: 3
  max_instances_per_cell: 2
sensitivity:
